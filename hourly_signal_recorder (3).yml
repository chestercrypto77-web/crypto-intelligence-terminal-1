name: Hourly Signal Recorder

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: hourly-signal-recorder
  cancel-in-progress: false

jobs:
  scan-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/workflow_heartbeat.py HOURLY START
      - name: Run hourly intelligence and trusted-learning chain
        run: python scripts/hourly_runner.py
      - run: python scripts/workflow_heartbeat.py HOURLY COMPLETE
      - name: Commit persistent runtime data
        run: |
          git config user.name "Crypto Intelligence Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "No runtime changes to commit."; exit 0; fi
          git commit -m "Hourly intelligence and learning records"
          git pull --rebase
          git push
