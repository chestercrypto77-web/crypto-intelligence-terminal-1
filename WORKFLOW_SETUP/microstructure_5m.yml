name: 5-Minute Microstructure Observer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: microstructure-observer
  cancel-in-progress: false

jobs:
  microstructure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Observe 1m and 5m market structure
        run: |
          python scripts/bootstrap_runtime.py
          python scripts/microstructure_observer.py
          python scripts/market_school.py
          python scripts/intelligence_hub.py
      - name: Validate protected runtime records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ["microstructure_latest.json","microstructure_history.json","market_school.json","intelligence_bus.json","engine_health.json"]:
              json.loads((Path("data")/name).read_text())
              print("PASS",name)
          PY
      - name: Commit microstructure learning
        run: |
          git config user.name "Microstructure Observer"
          git config user.email "actions@users.noreply.github.com"
          git add data/microstructure_latest.json data/microstructure_history.json data/market_school.json data/intelligence_bus.json data/engine_health.json
          git diff --cached --quiet || git commit -m "Update 1m/5m microstructure intelligence"
          git pull --rebase origin main
          git push origin main
