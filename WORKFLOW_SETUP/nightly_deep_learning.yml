name: Nightly Deep Learning Review

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: nightly-deep-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild learning evidence without opening trades
        run: |
          python scripts/bootstrap_runtime.py
          python scripts/market_school.py
          python scripts/trade_review_engine.py
          python scripts/trade_diagnostics.py
          python scripts/trade_coach.py
          python scripts/confidence_ledger.py
          python scripts/learning_engine.py
          python scripts/challenger_arena.py
          python scripts/intelligence_hub.py
          python scripts/brain_health.py
      - name: Commit learning records
        run: |
          git config user.name "Intelligence Learning Engine"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Nightly intelligence learning review"; git pull --rebase; git push; fi
