name: 15-Minute Observer

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: fifteen-minute-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap protected runtime files
        run: python scripts/bootstrap_runtime.py

      - name: Run 15-minute observer
        run: python scripts/observer_15m.py

      - name: Commit observer records
        run: |
          git config user.name "Crypto Observer Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/observer_latest.json data/observer_history.json data/observer_wallet.json data/signal_timing.json data/engine_health.json
          if git diff --cached --quiet; then
            echo "No observer changes to commit."
          else
            git commit -m "Update 15-minute observer records"
            git pull --rebase
            git push
          fi
