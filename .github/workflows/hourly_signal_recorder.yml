name: Hourly Signal Recorder

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: hourly-signal-recorder
  cancel-in-progress: false

jobs:
  scan-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stable hourly platform runner
        run: python scripts/hourly_runner.py

      - name: Commit persistent runtime data
        run: |
          git config user.name "Crypto Intelligence Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
          else
            git commit -m "Update hourly intelligence records"
            git pull --rebase
            git push
          fi
