name: 15-Minute Market Observer

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: fifteen-minute-market-observer
  cancel-in-progress: false

jobs:
  observe-and-scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap_runtime.py
      - name: Validate scalp mechanics
        run: python scripts/v9_1_scalp_smoke_test.py
      - name: Run Market Observer and Scalp Wallet
        run: python scripts/observer_15m.py
      - name: Verify JSON
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          for name in ["observer_latest.json","observer_history.json","observer_wallet.json","signal_timing.json","scalp_wallet.json","scalp_checkpoints.json","scalp_learning.json","engine_health.json"]:
              json.loads((Path("data")/name).read_text())
              print("PASS",name)
          PY2
      - name: Commit records
        run: |
          git config user.name "Market Observer Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/observer_latest.json data/observer_history.json data/observer_wallet.json data/signal_timing.json data/scalp_wallet.json data/scalp_checkpoints.json data/scalp_learning.json data/engine_health.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update 15-minute Observer and scalp wallet"; git pull --rebase; git push; fi
