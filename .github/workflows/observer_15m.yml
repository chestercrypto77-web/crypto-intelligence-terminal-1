name: 15-Minute Market Observer

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: fifteen-minute-market-observer
  cancel-in-progress: false

jobs:
  observe-and-scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/bootstrap_runtime.py
      - name: Validate scalp mechanics
        run: python scripts/v9_1_scalp_smoke_test.py
      - name: Refresh 1m/5m execution timing
        run: python scripts/microstructure_observer.py
      - name: Run Market Observer and Scalp Wallet
        run: python scripts/observer_15m.py
      - name: Review closed trades and re-entry opportunities
        run: python scripts/trade_review_engine.py
      - name: Update evidence-based learning state
        run: python scripts/learning_engine.py
      - name: Diagnose every completed trade
        run: python scripts/trade_diagnostics.py
      - name: Study charts, coach trades and refresh shared intelligence
        run: |
          python scripts/market_school.py
          python scripts/trade_coach.py
          python scripts/confidence_ledger.py
          python scripts/investment_committee.py
          python scripts/intelligence_hub.py
          python scripts/brain_health.py
      - name: Verify JSON
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          for name in ["microstructure_latest.json","microstructure_history.json","observer_latest.json","observer_history.json","observer_wallet.json","signal_timing.json","scalp_wallet.json","scalp_checkpoints.json","scalp_learning.json","trade_reviews.json","learning_state.json","trade_diagnostics.json","trade_coach.json","confidence_ledger.json","market_school.json","intelligence_bus.json","brain_health.json","engine_health.json"]:
              json.loads((Path("data")/name).read_text())
              print("PASS",name)
          PY2
      - name: Commit records
        run: |
          git config user.name "Market Observer Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update 15-minute Observer and scalp wallet"; git pull --rebase; git push; fi
